version: "3.8"

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - bot_data:/app/data

  # Optional — only needed if you set DB_BACKEND=mongo in .env.
  # Comment this whole service out (and MONGO_URI in .env) if you're
  # staying on the default SQLite backend.
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  bot_data:
  mongo_data:
